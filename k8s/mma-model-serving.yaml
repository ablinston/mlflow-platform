apiVersion: v1
kind: ConfigMap
metadata:
  name: mma-model-serving
  namespace: model-serving
data:
  DATASET_PATH: /data/final_dataset.parquet
  LOG_LEVEL: INFO


---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mma-data-pvc
  namespace: model-serving
spec:
  accessModes: ["ReadOnlyMany"]
  resources: 
    requests: 
      storage: 350M
  storageClassName: ""
  volumeName: mma-data-pv

---
apiVersion: v1
kind: Service
metadata: 
  name: mma-model-serving
  namespace: model-serving
spec:
  type: NodePort
  selector:
    app: mma-model-serving
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30550

---
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: mma-model-serving
  namespace: model-serving
spec:
  replicas: 0
  selector:
    matchLabels:
      app: mma-model-serving
  template:
    metadata:
      labels:
        app: mma-model-serving
    spec:
      containers:
        - name: mma-serving
          image: ghcr.io/ablinston/mma-serving:0.1.0
          ports:
            - containerPort: 8000
          volumeMounts:
            - mountPath: /data
              name: data
          envFrom:
            - configMapRef:
                name: mma-model-serving
            - secretRef:
                name: mma-model-serving-secrets
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000 ## user on Pi with access to access data
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 60
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              memory: 400Mi
              cpu: 1
            limits:
              memory: 1Gi
              cpu: 1
      volumes:
        - name: data
          persistentVolumeClaim: 
            claimName: mma-data-pvc
            readOnly: true

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mma-model-serving
  namespace: model-serving
spec:
  ingressClassName: traefik
  rules:
    - host: mma-model.192.168.68.51.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mma-model-serving
                port:
                  number: 8000