apiVersion: v1
kind: ConfigMap
metadata:
  name: mlflow-sandbox-config
  namespace: mlflow
data:
  MLFLOW_ARTIFACTS_DESTINATION: s3://ab-mlflow-artifacts/mlflow_sandbox
  MLFLOW_S3_ENDPOINT_URL: https://s3.eu-central-003.backblazeb2.com
  AWS_DEFAULT_REGION: eu-central-003
  MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
  MALLOC_ARENA_MAX: "2"

---
apiVersion: v1
kind: Service
metadata: 
  name: mlflow-sandbox
  namespace: mlflow
spec:
  type: NodePort
  selector:
    app: mlflow-sandbox
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500

---
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: mlflow-sandbox
  namespace: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow-sandbox
  template:
    metadata:
      labels:
        app: mlflow-sandbox
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/ablinston/mlflow-platform:0.1.1
          args: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--workers", "1"]
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: mlflow-sandbox-config
            - secretRef:
                name: mlflow-sandbox-secrets
          securityContext:
            runAsNonRoot: true
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 10
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 2Gi
