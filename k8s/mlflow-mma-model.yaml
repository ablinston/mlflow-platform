apiVersion: v1
kind: ConfigMap
metadata:
  name: mlflow-mma-model-config
  namespace: mlflow
data:
  MLFLOW_ARTIFACTS_DESTINATION: s3://ab-mlflow-artifacts/mlflow_mma_model
  MLFLOW_S3_ENDPOINT_URL: https://s3.eu-central-003.backblazeb2.com
  AWS_DEFAULT_REGION: eu-central-003
  MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
  MALLOC_ARENA_MAX: "2"
  MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow-mma-model.192.168.68.51.nip.io,mlflow-mma-model.192.168.68.51.nip.io:*,192.168.68.51:*"
  MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: "http://mlflow-mma-model.192.168.68.51.nip.io:8081"

---
apiVersion: v1
kind: Service
metadata: 
  name: mlflow-mma-model
  namespace: mlflow
spec:
  type: NodePort
  selector:
    app: mlflow-mma-model
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30501

---
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: mlflow-mma-model
  namespace: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow-mma-model
  template:
    metadata:
      labels:
        app: mlflow-mma-model
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/ablinston/mlflow-platform:0.1.1
          args: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--workers", "1"]
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: mlflow-mma-model-config
            - secretRef:
                name: mlflow-mma-model-secrets
          securityContext:
            runAsNonRoot: true
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 10
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 2Gi

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mlflow-mma-model
  namespace: mlflow
spec:
  ingressClassName: traefik
  rules:
    - host: mlflow-mma-model.192.168.68.51.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mlflow-mma-model
                port:
                  number: 5000